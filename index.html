<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LAE - Iniciar sesión</title>
  <link rel="stylesheet" href="css/estilos.css">
  <meta name="description" content="LAE - Luz y Amor Elevado: tienda de bienestar" />
</head>
<body class="no-cart page-login">
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <nav class="nav" role="navigation">
      <div class="nav-left">
        <a href="quienes-somos.html" class="nav-link">Quiénes somos</a>
        <a href="productos.html" class="nav-link">Productos</a>
      </div>
      <div class="nav-center">
        <div class="logo">❤❤❤LAE❤❤❤</div>
      </div>
      <div class="nav-right">
        <!-- No mostrar carrito en la pantalla de login -->
      </div>
    </nav>
  </header>

  <main id="main" class="main container two-column">
    <section class="hero-image">
      <img src="img/meditacion.png" alt="Ilustración de una persona meditando" />
    </section>

    <aside class="login-card">
      <div class="card">
        <h1>Inicia sesión</h1>
        <p>Inicia sesión en nuestra página para ordenar productos y poder hablar con el soporte</p>
        <form id="login-form" novalidate>
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" required placeholder="tu@correo.com">

          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" required placeholder="Contraseña">

          <p class="forgot"><a id="forgot-password" class="texto-error" href="#">¿Olvidaste la contraseña?</a></p>

          <button class="btn primary full" type="submit">Iniciar sesión</button>
          <p class="auth-switch">¿Aún no tienes cuenta? <a href="#" id="show-register">Regístrate</a></p>
        </form>
        <form id="register-form" class="hidden" novalidate>
          <label for="register-name">Nombre</label>
          <input id="register-name" name="name" type="text" required maxlength="120" autocomplete="name">
          <label for="register-email">Correo electrónico</label>
          <input id="register-email" name="email" type="email" required autocomplete="email">
          <label for="register-password">Contraseña (mínimo 8 caracteres)</label>
          <input id="register-password" name="password" type="password" required minlength="8" autocomplete="new-password">
          <button class="btn primary full" type="submit">Crear cuenta</button>
          <p class="auth-switch">¿Ya tienes cuenta? <a href="#" id="show-login">Inicia sesión</a></p>
        </form>
        <p id="auth-message" class="form-message" role="status" aria-live="polite"></p>
      </div>
    </aside>
  </main>

  <a class="whatsapp" href="https://wa.me/573000000000" aria-label="WhatsApp">☎</a>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
